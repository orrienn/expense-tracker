spring.application.name=expense-tracker

# Loads ../.env (repo root) as a properties file.
# "optional:" - a missing file is not an error (e.g. in Docker the variables come from the environment).
# System environment variables take precedence over values from the file.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL connection; the value after ":" is the default when the variable is missing
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates/updates tables from the entities (good enough while learning)
spring.jpa.hibernate.ddl-auto=update
# The DB session is not kept open for the whole HTTP request - lazy loading only in services
spring.jpa.open-in-view=false
