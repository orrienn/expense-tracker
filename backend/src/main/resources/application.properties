spring.application.name=expense-tracker

# Wczytuje ../.env (katalog główny repo) jako plik properties.
# "optional:" - brak pliku nie jest błędem (np. w Dockerze zmienne przyjdą ze środowiska).
# Zmienne środowiskowe systemu mają pierwszeństwo przed wartościami z pliku.
spring.config.import=optional:file:../.env[.properties]

# Połączenie z PostgreSQL; wartość po ":" to domyślna, gdy zmiennej brak
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate sam tworzy/aktualizuje tabele na podstawie encji (wystarczy na etapie nauki)
spring.jpa.hibernate.ddl-auto=update
# Sesja bazy nie jest trzymana do końca żądania HTTP - leniwe ładowanie tylko w serwisach
spring.jpa.open-in-view=false
