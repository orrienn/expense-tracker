# Konfiguracja tylko dla testów. Ten plik zastępuje src/main/resources/application.properties,
# więc testy nie potrzebują ani Dockera, ani pliku .env.

spring.application.name=expense-tracker

# H2 w pamięci: baza powstaje przy starcie testów i znika po ich zakończeniu.
# MODE=PostgreSQL - H2 udaje składnię Postgresa, żeby różnice były jak najmniejsze.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tabele tworzone od zera na każdy start testów i usuwane na końcu
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
