# Test-only configuration. This file replaces src/main/resources/application.properties,
# so tests need neither Docker nor the .env file.

spring.application.name=expense-tracker

# In-memory H2: the database is created when tests start and disappears when they finish.
# MODE=PostgreSQL - H2 mimics Postgres syntax to keep the differences as small as possible.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Tables are created from scratch on every test run and dropped at the end
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Fixed test-only JWT key (not a real secret, used only by tests)
jwt.secret=f4cxeaKm+isWosuSFEJsT+5a82VATLmUYSpSB/zL8jE=
jwt.expiration=1h
